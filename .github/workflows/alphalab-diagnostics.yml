name: AlphaLab Diagnostics

on:
  push:
    branches: [master]
    paths:
      - "research/**"
      - "artixcore_alphalab_v*.py"
      - ".github/workflows/alphalab-diagnostics.yml"
  pull_request:
    branches: [master]
    paths:
      - "research/**"
      - "artixcore_alphalab_v*.py"
      - ".github/workflows/alphalab-diagnostics.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: files/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r files/requirements.txt

      - name: Compile models and research scripts
        run: |
          python -m py_compile artixcore_alphalab_v33.py
          python -m py_compile artixcore_alphalab_v42.py
          python -m py_compile research/diagnose_v33_v42.py
          python -m py_compile research/evaluate_v43_candidates.py
          python -m py_compile research/evaluate_v43_holdout.py

      - name: Run period diagnostics
        run: python research/diagnose_v33_v42.py

      - name: Run v43 development candidates
        run: python research/evaluate_v43_candidates.py

      - name: Run frozen v43 holdout
        run: python research/evaluate_v43_holdout.py

      - name: Upload research tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphalab-v43-research
          path: research/output/
          if-no-files-found: error
          retention-days: 14
