name: AlphaLab Diagnostics

on:
  pull_request:
    branches: [master]
    paths:
      - "research/**"
      - "artixcore_alphalab_v*.py"
      - ".github/workflows/alphalab-diagnostics.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export v33 source
        run: |
          mkdir -p research/output/source
          cp artixcore_alphalab_v33.py research/output/source/

      - name: Upload v33 source
        uses: actions/upload-artifact@v4
        with:
          name: alphalab-v33-source
          path: research/output/source/
          if-no-files-found: error
          retention-days: 1
