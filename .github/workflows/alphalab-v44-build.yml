name: AlphaLab v44 Build

on:
  push:
    branches: [v44-final]
    paths:
      - "research/build_v44.py"
      - ".github/workflows/alphalab-v44-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout v44 branch
        uses: actions/checkout@v4
        with:
          ref: v44-final
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: files/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r files/requirements.txt

      - name: Build standalone v44
        run: python research/build_v44.py

      - name: Compile and leakage scan
        run: |
          python -m py_compile artixcore_alphalab_v44.py
          python - <<'PY'
          from pathlib import Path
          text = Path('artixcore_alphalab_v44.py').read_text()
          forbidden = ['shift(-', 'diff(-', 'center=True', 'bfill', 'backfill', 'np.roll']
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit(f'Forbidden patterns: {found}')
          print('Leakage scan passed')
          PY

      - name: Run full local validation
        working-directory: files
        run: python runner.py ../artixcore_alphalab_v44.py --full --gauge-fix

      - name: Commit generated v44
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artixcore_alphalab_v44.py
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Add AlphaLab v44 dual-horizon rank transport"
            git push origin v44-final
          fi
